<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Buy all the latest movies at Square Eyes"
    />
    <title>Square Eyes | Home</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aboreto&family=Monoton&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">
          <i class="fa-regular fa-house"></i>
        </a>
        <form id="search-form">
          <label for="search-input" class="hidden">Search Movies</label>
          <input type="search" id="search-input" placeholder="Search Movies" />
        </form>
        <a
          class="shopping-cart-container"
          href="checkout/index.html"
          aria-label="go to cart"
        >
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
      </nav>
    </header>
    <main>
      <div class="hidden toast-container" id="toast-container"></div>
      <h1 class="logo">Square Eyes</h1>
      <h2>Movies:</h2>
      <div id="filter-container">
        <form id="filter-form">
          <!-- Filter-checkboxes get added here -->
        </form>
      </div>
      <div class="movies-container" id="movies-container">
        <!-- Add movie-cards w JS -->
      </div>
      <div id="pagination-container">
        <!-- Add pagination-controls w JS -->
        <button id="prev-button">Prev</button>
        <div id="numbered-pages-container">
          <!-- Numbered buttons get added here -->
        </div>
        <button id="next-button">Next</button>
      </div>
    </main>
    <footer>
      <a href="footer/terms-and-conditions.html">Terms and Conditions</a>
      <a href="footer/privacy-policy.html">Privacy Policy</a>
    </footer>
    <script src="js/index.js" type="module"></script>
    <script
      src="https://kit.fontawesome.com/aa8166dc37.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
